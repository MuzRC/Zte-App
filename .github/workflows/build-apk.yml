name: Build ZTE Moder Signed APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      # Decode keystore dari GitHub Secrets ke dalam folder app/
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/ztemoder.jks

      # Compile Release APK yang siap di-sign
      - name: Build Signed APK
        env:
          KEYSTORE_FILE: "ztemoder.jks"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      # Upload fail Signed APK
      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ZTE-Moder-Signed-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7
